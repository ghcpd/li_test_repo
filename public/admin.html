<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - EventHub</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Admin - EventHub</h1>
    <a href="/">Home</a>
  </header>
  <section>
    <form id="create-form">
      <input placeholder="Title" name="title" required />
      <input placeholder="Date/Time (ISO)" name="date" required />
      <input placeholder="Location" name="location" required />
      <input placeholder="Total Seats" type="number" name="totalSeats" required />
      <input placeholder="Category" name="category" />
      <input placeholder="Description" name="description" />
      <button type="submit">Create</button>
    </form>
  </section>
  <main id="admin-events" class="grid"></main>

  <template id="admin-card">
    <div class="card">
      <h3 class="title"></h3>
      <button class="edit">Edit</button>
      <button class="delete danger">Delete</button>
    </div>
  </template>

  <script src="/admin.js"></script>
</body>
</html>
