<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Team Task Board</h1>
            <div class="header-controls">
                <input type="text" id="searchInput" placeholder="Search tasks..." />
                <select id="filterAssignee">
                    <option value="">All Assignees</option>
                </select>
                <button id="addTaskBtn">+ Add Task</button>
            </div>
        </header>

        <div class="board">
            <div class="column" data-status="todo">
                <h2>To Do <span class="task-count">0</span></h2>
                <div class="task-list" id="todo-list"></div>
            </div>
            <div class="column" data-status="inprogress">
                <h2>In Progress <span class="task-count">0</span></h2>
                <div class="task-list" id="inprogress-list"></div>
            </div>
            <div class="column" data-status="completed">
                <h2>Completed <span class="task-count">0</span></h2>
                <div class="task-list" id="completed-list"></div>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add New Task</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Title:</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description:</label>
                    <textarea id="taskDescription" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="taskAssignee">Assignee:</label>
                    <input type="text" id="taskAssignee" placeholder="Enter assignee name">
                </div>
                <div class="form-group">
                    <label for="taskDueDate">Due Date:</label>
                    <input type="date" id="taskDueDate">
                </div>
                <div class="form-actions">
                    <button type="button" id="cancelBtn">Cancel</button>
                    <button type="submit" id="saveBtn">Save Task</button>
                    <button type="button" id="deleteBtn" style="display: none;">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
