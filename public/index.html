<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <i class="fas fa-calendar-alt"></i>
                EventHub
            </h1>
            <nav class="nav">
                <a href="#" id="home-link" class="nav-link active">Events</a>
                <a href="#" id="recently-viewed-link" class="nav-link">Recently Viewed</a>
                <a href="/admin" class="nav-link admin-link">Admin</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <!-- Search and Filter Section -->
        <section class="search-section">
            <div class="container">
                <div class="search-bar">
                    <div class="search-input-group">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-input" placeholder="Search events..." class="search-input">
                    </div>
                    <div class="filter-group">
                        <select id="category-filter" class="filter-select">
                            <option value="">All Categories</option>
                            <option value="conference">Conference</option>
                            <option value="workshop">Workshop</option>
                            <option value="seminar">Seminar</option>
                            <option value="networking">Networking</option>
                            <option value="training">Training</option>
                        </select>
                        <input type="date" id="date-filter" class="filter-input">
                    </div>
                </div>
            </div>
        </section>

        <!-- Events Grid -->
        <section class="events-section">
            <div class="container">
                <div class="section-header">
                    <h2>Upcoming Events</h2>
                    <div class="status-indicator">
                        <span id="connection-status" class="status-dot online"></span>
                        <span>Live Updates</span>
                    </div>
                </div>
                <div id="events-grid" class="events-grid">
                    <!-- Events will be loaded here -->
                </div>
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>Loading events...</p>
                </div>
                <div id="no-events" class="no-events" style="display: none;">
                    <i class="fas fa-calendar-times"></i>
                    <h3>No events found</h3>
                    <p>Try adjusting your search filters</p>
                </div>
            </div>
        </section>

        <!-- Recently Viewed Section -->
        <section id="recently-viewed-section" class="events-section" style="display: none;">
            <div class="container">
                <div class="section-header">
                    <h2>Recently Viewed Events</h2>
                </div>
                <div id="recently-viewed-grid" class="events-grid">
                    <!-- Recently viewed events will be loaded here -->
                </div>
                <div id="no-recent-events" class="no-events" style="display: none;">
                    <i class="fas fa-history"></i>
                    <h3>No recently viewed events</h3>
                    <p>Browse some events to see them here</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Event Detail Modal -->
    <div id="event-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modal-body">
                <!-- Event details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Registration Modal -->
    <div id="registration-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-header">
                <h2><i class="fas fa-user-plus"></i> Register for Event</h2>
            </div>
            <form id="registration-form" class="form">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" name="email" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-registration">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-check"></i>
                        Register
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notification-container" class="notification-container"></div>

    <!-- Offline Indicator -->
    <div id="offline-indicator" class="offline-indicator" style="display: none;">
        <i class="fas fa-wifi"></i>
        <span>You're offline. Showing cached events.</span>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
